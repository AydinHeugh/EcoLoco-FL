<style>
  :root {
    --bg: #f7f9f5; --card: #ffffff; --ink: #1b261d; --muted: #5d6b60; --line: #dde4da;
    --edge: #8a978c; --caller: #d97706; --callee: #2563eb; --sel: #111827;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111612; --card: #1a211c; --ink: #e6ede7; --muted: #9aa89d; --line: #2c362e;
      --edge: #6c7a6f; --caller: #f59e0b; --callee: #60a5fa; --sel: #f3f4f6;
    }
  }
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
  .app { display: flex; flex-direction: column; height: 100%; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--line); z-index: 5; }
  h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, var(--card)); }
  .sw.planned { border-style: dashed; --c: var(--muted); background: transparent; }
  .sw.dead { border-style: dotted; --c: #9ca3af; background: transparent; }
  .sw.caller { --c: var(--caller); } .sw.callee { --c: var(--callee); }
  .sw.change { --c: var(--caller); background: transparent; }
  .chip[title] { cursor: help; }
  .btn { font: inherit; font-size: 13px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .gl { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 10px; font-size: 13.5px; }
  .gl .sw { flex: none; margin-top: 3px; }
  .gl-where { font-size: 12px; color: var(--muted); }
  .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
  input[type=search] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); width: 210px; max-width: 100%; }
  label.toggle { font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }

  .main { position: relative; flex: 1; min-height: 0; }
  .react-flow { --xy-background-color: var(--bg); }
  .react-flow__edge-textbg { fill: var(--card); }
  .elabel { position: absolute; box-sizing: border-box; max-width: 180px; padding: 3px 5px; border-radius: 3px;
    font: 11px/14px system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; color: var(--ink);
    background: color-mix(in srgb, var(--card) 92%, transparent); pointer-events: none; overflow-wrap: break-word; }
  .react-flow__controls button { background: var(--card); color: var(--ink); border-color: var(--line); }
  .react-flow__controls button svg { fill: var(--ink); }
  .react-flow__minimap { background: var(--card); }

  /* nodes */
  .cn { width: 240px; padding: 7px 10px 8px; border-radius: 9px; border: 1.5px solid var(--c);
    background: color-mix(in srgb, var(--c) 11%, var(--card)); color: var(--ink);
    box-shadow: 0 1px 2px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; cursor: pointer; }
  .cn:hover { box-shadow: 0 2px 10px rgb(0 0 0 / .14); }
  .cn.planned { border-style: dashed; border-width: 2px; background: color-mix(in srgb, var(--c) 5%, var(--card)); }
  .cn.dead { --c: #9ca3af; border-style: dotted; border-width: 2px; background: color-mix(in srgb, #9ca3af 8%, var(--card)); }
  .cn.sel { box-shadow: 0 0 0 3px var(--sel); }
  .cn.callee { box-shadow: 0 0 0 3px var(--callee); }
  .cn.caller { box-shadow: 0 0 0 3px var(--caller); }
  .cn.dim { opacity: .22; }
  .cn-top { display: flex; justify-content: space-between; gap: 6px; font-size: 10px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .05em; color: var(--c); }
  .tag { padding: 0 5px; border-radius: 4px; border: 1px solid currentColor; font-size: 9.5px; }
  .tag.planned { color: var(--muted); border-style: dashed; }
  .tag.dead { color: #9ca3af; border-style: dotted; }
  .tag.change { color: var(--caller); }
  .cn-label { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 650; font-size: 12.5px;
    margin-top: 2px; overflow-wrap: anywhere; }
  .cn-file { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .cn-goal { margin-top: 4px; font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .react-flow__handle { width: 6px; height: 6px; background: var(--edge); border: 0; }

  /* side panel */
  .panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--card);
    border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 18px 28px; z-index: 6;
    box-shadow: -6px 0 24px rgb(0 0 0 / .08); }
  .panel .close { position: sticky; top: 0; float: right; font: inherit; font-size: 18px; line-height: 1;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .panel h2 { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 17px; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  .panel .where { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .panel .where a { color: inherit; }
  .panel ol { padding-left: 20px; margin: 0; } .panel li { margin: 0 0 7px; }
  .panel code { background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 0 4px; border-radius: 4px; }
  .goal { margin-top: 12px; padding: 9px 11px; border: 2px dashed var(--muted); border-radius: 8px; font-size: 13px; }
  .goal.change { border-color: var(--caller); }
  .goal b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .link { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-left: 4px solid var(--k); border-radius: 7px; padding: 7px 10px; margin: 0 0 6px; cursor: pointer; }
  .link:hover { background: color-mix(in srgb, var(--k) 8%, transparent); }
  .link .t { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 650; font-size: 12.5px; }
  .link .l { font-size: 12.5px; } .link .d { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .link.planned { border-style: dashed; border-left-style: solid; }
  .empty { color: var(--muted); font-size: 13px; }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; white-space: nowrap; z-index: 4; font-size: 12px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); padding: 5px 9px; border-radius: 6px; }
  #err { padding: 24px; color: #b00020; white-space: pre-wrap; }
  @media (max-width: 700px) { .panel { top: 40%; width: 100%; border-left: 0; border-top: 1px solid var(--line); } .tools { margin-left: 0; } .react-flow__minimap { display: none; } }
</style>

<script type="module">
import React, { useState, useMemo, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { ReactFlow, ReactFlowProvider, Background, Controls, MiniMap, Handle, Position, MarkerType,
         useNodesState, useReactFlow, BaseEdge, EdgeLabelRenderer, getBezierPath } from '@xyflow/react';
import htm from 'htm';
const html = htm.bind(React.createElement);

const G = JSON.parse(document.getElementById('graph-data').textContent);
const BY_ID = Object.fromEntries(G.nodes.map(n => [n.id, n]));
// Keep `desc` in step with the Glossary in ARCHITECTURE.md.
const LAYERS = {
  ui:     { name: 'Screen / UI',  color: '#2e7d32', where: 'frontend/screens/, AppNavigator.js',
            desc: 'What the user sees and taps in the Expo app.' },
  device: { name: 'Device',       color: '#607d8b', where: 'expo-image-picker, expo-clipboard',
            desc: 'Phone features the app borrows: camera / photo library and clipboard.' },
  client: { name: 'API client',   color: '#1e6fb8', where: 'frontend/services/',
            desc: 'Small frontend functions that send requests over the internet to our backend.' },
  route:  { name: 'Flask route',  color: '#c77800', where: 'backend/app.py',
            desc: 'A backend URL that receives those requests — the front door of the Python server.' },
  svc:    { name: 'Service',      color: '#7b3fa0', where: 'backend/services/',
            desc: 'Backend functions that do the real work once a route gets a request.' },
  data:   { name: 'Bundled data', color: '#00897b', where: 'backend/data/*.json (planned)',
            desc: 'Data files shipped with the backend instead of fetched online.' },
  ext:    { name: 'External API', color: '#c0392b', where: 'OpenAI, iNaturalist, Nominatim, USDA (later)',
            desc: 'Outside services the backend calls over the internet.' },
};
const MARKERS = [
  { cls: 'planned', name: 'Planned',         desc: "Doesn't exist yet but is decided. Drawn dashed, with its goal." },
  { cls: 'change',  name: 'Change planned',  desc: 'Exists today, but a planned change will modify it (e.g. a rename).' },
  { cls: 'dead',    name: 'Dead code',       desc: 'Exists but does nothing useful. Drawn dotted grey.' },
  { cls: 'caller',  name: 'Calls it',        desc: 'After you click a node: the nodes that use it (orange).' },
  { cls: 'callee',  name: 'It calls',        desc: 'After you click a node: the nodes it uses (blue).' },
];
const COL_W = 450, ROW_H = 118;

// GitHub Pages serves only docs/, so source files must link to github.com instead.
const SOURCE_BASE = location.hostname.endsWith('.github.io')
  ? `https://github.com/${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}/blob/master/`
  : '../';

// Centre a node in the part of the canvas the side panel doesn't cover.
const PANEL_W = 420;
function centerOn(inst, id, zoom) {
  const n = inst.getNode(id);
  if (!n) return;
  const shift = window.innerWidth > 700 ? PANEL_W / 2 / zoom : 0;
  inst.setCenter(n.position.x + 120 + shift, n.position.y + 45, { zoom, duration: 400 });
}

// `code` spans in prose → <code>
const rich = s => String(s).split('`').map((p, i) => i % 2 ? html`<code key=${i}>${p}</code>` : p);

function CodeNode({ data }) {
  const L = LAYERS[data.layer];
  const tag = data.status === 'planned' ? html`<span class="tag planned">planned</span>`
            : data.status === 'dead'    ? html`<span class="tag dead">dead</span>`
            : data.goal                 ? html`<span class="tag change">change planned</span>` : null;
  return html`
    <div class=${`cn ${data.status} ${data.hl || ''}`} style=${{ '--c': L.color }}>
      <${Handle} type="target" position=${Position.Left} />
      <div class="cn-top"><span>${L.name}</span>${tag}</div>
      <div class="cn-label">${data.label}</div>
      ${data.file && html`<div class="cn-file">${data.file}</div>`}
      ${data.goal && data.status !== 'live' && html`<div class="cn-goal">goal: ${data.goal}</div>`}
      <${Handle} type="source" position=${Position.Right} />
    </div>`;
}
const nodeTypes = { code: CodeNode };

// Same control points as React Flow's getBezierPath for a Right → Left edge,
// so a label placed at parameter t sits exactly on the drawn curve.
function bezierPoint(sx, sy, tx, ty, t) {
  const d = tx - sx, c = d >= 0 ? 0.5 * d : 0.25 * 25 * Math.sqrt(-d);
  const c1x = sx + c, c2x = tx - c, u = 1 - t;
  return {
    x: u * u * u * sx + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * tx,
    y: u * u * u * sy + 3 * u * u * t * sy + 3 * u * t * t * ty + t * t * t * ty,
  };
}

const LABEL_MAX_W = 180;
const measure = document.createElement('canvas').getContext('2d');
function labelSize(text) {
  measure.font = '11px system-ui, -apple-system, "Segoe UI", sans-serif';
  const w = measure.measureText(text).width;
  const lines = Math.ceil((w * 1.1) / (LABEL_MAX_W - 10));
  return { w: Math.min(w + 10, LABEL_MAX_W), h: lines * 14 + 6 };
}

const T_CANDIDATES = [0.5, ...Array.from({ length: 14 }, (_, i) => [0.5 - (i + 1) * 0.03, 0.5 + (i + 1) * 0.03]).flat()];
const overlap = (a, b) => Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1)) * Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));

// Midpoint labels land on nodes when an edge skips a column or stays in one, so
// slide each label along its curve to the free spot nearest the middle.
function placeLabels(nodes, edges) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const size = n => ({ w: n.measured?.width ?? 240, h: n.measured?.height ?? 80 });
  const taken = nodes.map(n => {
    const { w, h } = size(n);
    return { x1: n.position.x - 6, y1: n.position.y - 6, x2: n.position.x + w + 6, y2: n.position.y + h + 6 };
  });
  const placed = {};
  for (const e of edges) {
    const s = byId[e.source], t = byId[e.target];
    const sx = s.position.x + size(s).w + 3, sy = s.position.y + size(s).h / 2;
    const tx = t.position.x - 3, ty = t.position.y + size(t).h / 2;
    const { w, h } = labelSize(e.text);
    let best;
    for (const tt of T_CANDIDATES) {
      const p = bezierPoint(sx, sy, tx, ty, tt);
      const box = { x1: p.x - w / 2, y1: p.y - h / 2, x2: p.x + w / 2, y2: p.y + h / 2 };
      const cost = taken.reduce((sum, b) => sum + overlap(box, b), 0);
      if (!best || cost < best.cost) best = { t: tt, cost, box };
      if (cost === 0) break;
    }
    taken.push(best.box);
    placed[e.id] = best.t;
  }
  return placed;
}

function LabelledEdge({ id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, style, markerEnd, data }) {
  const [path] = getBezierPath({ sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition });
  const p = data.text && bezierPoint(sourceX, sourceY, targetX, targetY, data.t ?? 0.5);
  return html`
    <${React.Fragment}>
      <${BaseEdge} id=${id} path=${path} style=${style} markerEnd=${markerEnd} />
      ${p && html`<${EdgeLabelRenderer}>
        <div class="elabel" style=${{ transform: `translate(-50%, -50%) translate(${p.x}px, ${p.y}px)`, zIndex: data.front ? 10 : 0 }}>${data.text.replace(/\(/g, '(​')}</div>
      <//>`}
    <//>`;
}
const edgeTypes = { labelled: LabelledEdge };

const initialNodes = G.nodes.map(n => ({
  id: n.id, type: 'code', data: n, position: { x: n.col * COL_W, y: n.row * ROW_H },
}));

function LinkList({ title, edges, side, kind, onPick }) {
  return html`
    <h3>${title} (${edges.length})</h3>
    ${edges.length === 0 && html`<div class="empty">Nothing.</div>`}
    ${edges.map(e => {
      const other = BY_ID[e[side]];
      return html`
        <button key=${e.from + e.to} class=${'link ' + (e.status || '')} style=${{ '--k': `var(--${kind})` }}
                onClick=${() => onPick(other.id)}>
          <div class="t">${other.label}${other.status !== 'live' ? ` · ${other.status.toUpperCase()}` : ''}</div>
          <div class="l">${rich(e.label)}</div>
          ${e.detail && html`<div class="d">${rich(e.detail)}</div>`}
        </button>`;
    })}`;
}

function Panel({ node, out, inc, onPick, onClose }) {
  const L = LAYERS[node.layer];
  const goalLabel = node.status === 'planned' ? 'PLANNED — goal' : node.status === 'dead' ? 'DEAD — goal' : 'Change planned';
  return html`
    <aside class="panel">
      <button class="close" onClick=${onClose} title="Close">×</button>
      <div class="cn-top" style=${{ '--c': L.color, justifyContent: 'flex-start', gap: '8px' }}>
        <span>${L.name}</span>
        ${node.status !== 'live' && html`<span class=${'tag ' + node.status}>${node.status}</span>`}
      </div>
      <h2>${node.label}</h2>
      <div class="where">
        ${node.file
          ? html`<a href=${SOURCE_BASE + node.file} target="_blank" rel="noopener">${node.file}</a>`
          : 'no file yet'}
        ${node.symbol && html` · <code>${node.symbol}</code>`}
      </div>
      ${node.goal && html`<div class=${'goal ' + (node.status === 'live' ? 'change' : '')}><b>${goalLabel}</b>${rich(node.goal)}</div>`}
      <h3>What it does</h3>
      <div>${rich(node.what)}</div>
      <h3>How it works</h3>
      <ol>${node.how.map((s, i) => html`<li key=${i}>${rich(s)}</li>`)}</ol>
      <${LinkList} title="Calls / uses" edges=${out} side="to" kind="callee" onPick=${onPick} />
      <${LinkList} title="Called / used by" edges=${inc} side="from" kind="caller" onPick=${onPick} />
    </aside>`;
}

function Glossary({ onClose }) {
  return html`
    <aside class="panel">
      <button class="close" onClick=${onClose} title="Close">×</button>
      <h2>Glossary</h2>
      <div>A scan travels <b>Screen → API client → Flask route → Service → External API / Bundled data</b>, and the answer comes back the same way.</div>
      <h3>Layers</h3>
      ${Object.entries(LAYERS).map(([k, L]) => html`
        <div key=${k} class="gl">
          <span class="sw" style=${{ '--c': L.color }}></span>
          <div><b>${L.name}</b> — ${L.desc}<div class="gl-where">${L.where}</div></div>
        </div>`)}
      <h3>Markers</h3>
      ${MARKERS.map(m => html`
        <div key=${m.cls} class="gl">
          <span class=${'sw ' + m.cls}></span>
          <div><b>${m.name}</b> — ${m.desc}</div>
        </div>`)}
    </aside>`;
}

function App() {
  const [nodes, , onNodesChange] = useNodesState(initialNodes);
  const [sel, setSel] = useState(() => (BY_ID[location.hash.slice(1)] ? location.hash.slice(1) : null));
  const [showLabels, setShowLabels] = useState(true);
  const [showHelp, setShowHelp] = useState(false);
  const rf = useReactFlow();

  const out = useMemo(() => (sel ? G.edges.filter(e => e.from === sel) : []), [sel]);
  const inc = useMemo(() => (sel ? G.edges.filter(e => e.to === sel) : []), [sel]);

  const select = useCallback((id, center) => {
    setSel(id);
    if (id) setShowHelp(false);
    history.replaceState(null, '', id ? '#' + id : location.pathname);
    if (id && center) centerOn(rf, id, Math.max(rf.getZoom(), 0.85));
  }, [rf]);

  const viewNodes = useMemo(() => {
    const callees = new Set(out.map(e => e.to)), callers = new Set(inc.map(e => e.from));
    return nodes.map(n => {
      const hl = !sel ? '' : n.id === sel ? 'sel' : callees.has(n.id) ? 'callee' : callers.has(n.id) ? 'caller' : 'dim';
      return { ...n, data: { ...n.data, hl } };
    });
  }, [nodes, sel, out, inc]);

  const visibleLabels = useMemo(() => (showLabels ? G.edges : [])
    .filter(e => !sel || e.from === sel || e.to === sel)
    .map(e => ({ id: `${e.from}->${e.to}`, source: e.from, target: e.to, text: e.label })), [sel, showLabels]);
  const labelT = useMemo(() => placeLabels(nodes, visibleLabels), [nodes, visibleLabels]);

  const viewEdges = useMemo(() => G.edges.map(e => {
    const id = `${e.from}->${e.to}`;
    const isOut = sel === e.from, isIn = sel === e.to, faded = sel && !isOut && !isIn;
    const color = isOut ? 'var(--callee)' : isIn ? 'var(--caller)' : e.status === 'dead' ? '#9ca3af' : 'var(--edge)';
    return {
      id, source: e.from, target: e.to, type: 'labelled',
      data: { text: id in labelT ? e.label : null, t: labelT[id], front: isOut || isIn },
      animated: !!(isOut || isIn),
      zIndex: isOut || isIn ? 10 : 0,
      style: { stroke: color, strokeWidth: isOut || isIn ? 2.2 : 1.3, opacity: faded ? 0.1 : 1,
               strokeDasharray: e.status === 'planned' ? '6 4' : e.status === 'dead' ? '2 4' : undefined },
      markerEnd: { type: MarkerType.ArrowClosed, color, width: 16, height: 16 },
    };
  }), [sel, labelT]);

  function onSearch(ev) {
    if (ev.key !== 'Enter') return;
    const q = ev.target.value.toLowerCase().trim();
    const hit = q && G.nodes.find(n => [n.label, n.file, n.symbol, n.id].join(' ').toLowerCase().includes(q));
    if (hit) select(hit.id, true);
  }

  return html`
    <div class="app">
      <header>
        <h1>EcoLoco-FL architecture</h1>
        <div class="legend">
          ${Object.entries(LAYERS).map(([k, L]) => html`<span key=${k} class="chip" title=${L.desc}><span class="sw" style=${{ '--c': L.color }}></span>${L.name}</span>`)}
          ${MARKERS.filter(m => m.cls !== 'change').map(m => html`<span key=${m.cls} class="chip" title=${m.desc}><span class=${'sw ' + m.cls}></span>${m.name}</span>`)}
        </div>
        <div class="tools">
          <button class="btn" onClick=${() => { if (!showHelp) select(null); setShowHelp(!showHelp); }}>${showHelp ? 'Close glossary' : 'Glossary'}</button>
          <input type="search" placeholder="Find a file or function… ⏎" onKeyDown=${onSearch} />
          <label class="toggle"><input type="checkbox" checked=${showLabels} onChange=${e => setShowLabels(e.target.checked)} />Arrow labels</label>
        </div>
      </header>
      <div class="main">
        <${ReactFlow}
          nodes=${viewNodes} edges=${viewEdges} nodeTypes=${nodeTypes} edgeTypes=${edgeTypes}
          onNodesChange=${onNodesChange}
          onNodeClick=${(_, n) => select(n.id, rf.getZoom() < 0.6)}
          onPaneClick=${() => select(null)}
          onInit=${inst => sel && centerOn(inst, sel, 0.9)}
          nodesConnectable=${false} edgesFocusable=${false}
          fitView=${!sel} fitViewOptions=${{ padding: 0.08 }} minZoom=${0.1} maxZoom=${2.5}
          colorMode="system" proOptions=${{ hideAttribution: true }}>
          <${Background} gap=${22} size=${1} />
          <${Controls} showInteractive=${false} />
          <${MiniMap} pannable zoomable nodeColor=${n => LAYERS[n.data.layer].color} nodeStrokeWidth=${0}
                      style=${{ right: sel || showHelp ? 436 : 12 }} />
        <//>
        ${showHelp && !sel && html`<${Glossary} onClose=${() => setShowHelp(false)} />`}
        ${!sel && !showHelp && html`<div class="hint">Drag nodes or the canvas · scroll to zoom · click a node to see what it does and what it connects to</div>`}
        ${sel && html`<${Panel} node=${BY_ID[sel]} out=${out} inc=${inc} onPick=${id => select(id, true)} onClose=${() => select(null)} />`}
      </div>
    </div>`;
}

try {
  createRoot(document.getElementById('root')).render(html`<${ReactFlowProvider}><${App} /><//>`);
} catch (err) {
  document.getElementById('root').innerHTML = '<div id="err">Failed to start: ' + (err?.message || err) + '</div>';
}
</script>
</body>
</html>
