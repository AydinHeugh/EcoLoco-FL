name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q

  build-and-deploy:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      CF_PAGES: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ecoloco-api.onrender.com' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test saved audits
        run: npm test
      - name: Build website
        run: npm run build:web
      - name: Deploy website to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # The existing direct-upload project's production branch is named main.
          command: pages deploy dist --project-name=ecoloco --branch=main
      - name: Check published website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: node scripts/check-deployment.mjs "$DEPLOYMENT_URL" "$GITHUB_SHA"
